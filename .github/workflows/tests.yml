name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # В репозитории нет data/ (личные выгрузки в .gitignore), поэтому
      # тесты на реальных данных пропускаются, а синтетические выполняются.
      - name: Run tests
        run: python -m unittest discover -s tests -v
